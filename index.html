<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christian Jamett</title>
<meta name="description" content="Christian Jamett, fotoperiodista chileno. Arica, Chile.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Open Sans 300/600: la misma que usa albertopolophotography.com. Inter 200 imita su logo (Helvetica Neue Light en PNG). -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,600;1,300&family=Inter:wght@200&family=Gochi+Hand&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  body { font-family: "Open Sans", sans-serif; font-weight: 300; font-size: 14px; line-height: 22px; color: #000; }
  a { color: inherit; text-decoration: none; }
  .lucida { font-family: "Lucida Grande", "Lucida Sans Unicode", Arial, sans-serif; color: #bababa; }

  /* Columna izquierda fija; el fondo blanco tapa las fotos que pasan por debajo */
  .lateral {
    position: fixed; top: 0; left: 0; bottom: 0; width: 315px; z-index: 300;
    background: #fff; padding: 0 30px; overflow: hidden auto;
  }
  .logo {
    display: block; margin-top: 26px; height: 52px;
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 200;
    font-size: 39px; line-height: 52px; letter-spacing: -.035em; color: #808080; white-space: nowrap;
  }
  .menu { list-style: none; margin-top: 62px; margin-bottom: 20px; }
  .menu li.espacio { height: 22px; }
  .menu a:hover, .menu a[aria-current="page"] { color: #666; }
  .derechos { font-size: 13px; line-height: 17px; }
  .idiomas { margin-top: 10px; font-size: 13px; line-height: 17px; }
  .idiomas button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; margin-right: 8px; }
  .idiomas button:hover, .idiomas button[aria-pressed="true"] { color: #666; }
  .ig { display: inline-block; margin-top: 12px; color: #bababa; }
  .ig:hover { color: #666; }

  /* Tira horizontal de fotos */
  .galeria { position: absolute; top: 140px; left: 315px; display: flex; gap: 17px; padding-right: 30px; }
  .galeria figure { flex: none; }
  .galeria img { display: block; height: calc(100vh - 283px); min-height: 320px; width: auto; background: #f9f9f9; }
  .galeria figcaption { margin-top: 6px; font-size: 11px; font-weight: 800; line-height: 17px; display: none; }
  /* Inicio: la portada centrada en el espacio libre; el pie va en la misma fila que el lema */
  .galeria.inicio { right: 30px; justify-content: center; }
  .galeria.inicio figure { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 20px; }
  .galeria.inicio img { grid-column: 1 / -1; }
  .galeria.inicio figcaption { display: block; }
  .en-inicio .pie-fijo { display: none; }
  /* Lema manuscrito bajo la portada, como en el christianjamett.com anterior */
  .lema { margin-top: 2px; text-align: right; font-family: "Gloria Hallelujah", cursive; font-size: 21px; line-height: 30px; color: #444; }
  /* El lema aparece con un fundido suave */
  .lema { animation: fundido 1.6s ease .4s both; }
  @keyframes fundido { from { opacity: 0; } }
  /* Pie fijo bajo la tira: no se mueve con las fotos, cambia según la foto a la vista */
  .pie-fijo {
    position: fixed; left: 315px; top: calc(146px + max(100vh - 283px, 320px));
    font-size: 11px; font-weight: 800; line-height: 17px; transition: opacity .25s;
  }

  /* Tienda: secciones por tipo; cada producto en un marco igual, con la foto completa */
  /* Una sola grilla continua (sin huecos); el tipo se nombra sobre el primer producto de cada grupo */
  .tienda { position: absolute; top: 140px; left: 315px; right: 30px; padding-bottom: 60px; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 40px 22px; }
  .tipo {
    display: block; min-height: 26px; margin-bottom: 14px; border-bottom: 1px solid #eee;
    font-size: 11px; line-height: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .marco { display: block; aspect-ratio: 1; background: #f6f6f6; padding: 12px; }
  .marco img { display: block; width: 100%; height: 100%; object-fit: contain; transition: opacity .2s; }
  .grilla a:hover .marco img { opacity: .85; }
  .pie { margin-top: 10px; font-size: 11px; line-height: 17px; }
  .pie strong, .ficha strong { font-weight: 700; }
  .pie .precio, .ficha .precio { color: #888; }
  .ficha { position: absolute; top: 140px; left: 315px; right: 30px; display: flex; gap: 40px; align-items: flex-start; padding-bottom: 60px; }
  .ficha .imagenes { flex: none; display: grid; gap: 17px; width: 360px; }
  .ficha .imagenes img { display: block; width: 100%; height: auto; background: #f6f6f6; }
  .ficha .datos { max-width: 400px; font-size: 11px; line-height: 17px; }
  .ficha .datos p + p { margin-top: 11px; }
  .ficha .datos a:hover { color: #666; }

  /* ---------- Blog ---------- */
  .blog { position: absolute; top: 140px; left: 315px; right: 30px; max-width: 980px; padding-bottom: 80px; }
  .entrada-item { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; align-items: center; padding-bottom: 48px; margin-bottom: 48px; border-bottom: 1px solid #eee; }
  .entrada-item:last-child { border-bottom: 0; margin-bottom: 0; }
  .entrada-item.destacada { grid-template-columns: 1fr; gap: 24px; }
  .entrada-item .foto { display: block; overflow: hidden; aspect-ratio: 3 / 2; background: #f6f6f6; }
  .entrada-item.destacada .foto { aspect-ratio: 16 / 9; }
  .entrada-item .foto img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2, .7, .2, 1); }
  .entrada-item:hover .foto img { transform: scale(1.04); }
  .meta { font-size: 11px; line-height: 17px; letter-spacing: .08em; text-transform: uppercase; }
  .entrada-item h2 { font-weight: 300; font-size: 28px; line-height: 1.2; margin: 10px 0 12px; color: #111; }
  .entrada-item.destacada h2 { font-size: 36px; }
  .entrada-item .extracto { color: #888; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .leer { display: inline-block; margin-top: 16px; font-size: 13px; color: #000; }
  .leer span { display: inline-block; transition: transform .35s cubic-bezier(.2, .7, .2, 1); }
  .entrada-item:hover .leer span { transform: translateX(6px); }

  .entrada { position: absolute; top: 140px; left: 315px; right: 30px; max-width: 720px; padding-bottom: 100px; }
  .entrada .volver { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .entrada .volver:hover { color: #666; }
  .entrada h1 { font-weight: 300; font-size: 40px; line-height: 1.15; margin: 22px 0 14px; color: #111; }
  .entrada .portada { margin: 36px 0 40px; }
  .entrada img { display: block; width: 100%; height: auto; background: #f6f6f6; }
  .cuerpo p { font-size: 16px; line-height: 28px; color: #555; }
  .cuerpo p + p { margin-top: 20px; }
  .cuerpo .lead { font-size: 20px; line-height: 30px; color: #222; margin-bottom: 28px; }
  .cuerpo h2 { font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #111; margin: 48px 0 16px; }
  .cuerpo .cita { font-weight: 300; font-size: 26px; line-height: 36px; color: #111; border-left: 1px solid #111; padding-left: 22px; margin: 40px 0; }
  .cuerpo figure { margin: 44px 0; }
  .cuerpo a { color: #000; text-decoration: underline; text-decoration-color: #ccc; text-underline-offset: 3px; }
  .cuerpo a:hover { text-decoration-color: #000; }
  .vecinas { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 64px; padding-top: 24px; border-top: 1px solid #eee; }
  .vecinas a { display: block; }
  .vecinas a + a, .vecinas .derecha { text-align: right; }
  .vecinas strong { display: block; margin-top: 6px; font-weight: 300; font-size: 18px; line-height: 1.3; color: #111; transition: color .2s; }
  .vecinas a:hover strong { color: #888; }

  /* Barra de lectura y apariciones al bajar */
  .progreso { position: fixed; top: 0; left: 0; right: 0; height: 2px; background: #111; transform-origin: 0 50%; transform: scaleX(0); z-index: 500; pointer-events: none; }
  [data-aparece] { opacity: 0; transform: translateY(18px); transition: opacity .9s ease, transform .9s cubic-bezier(.2, .7, .2, 1); }
  [data-aparece].visible { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { [data-aparece] { transform: none; } }

  /* Páginas de texto (Bio, Exhibitions, Contact) */
  .texto { position: absolute; top: 140px; left: 315px; max-width: 690px; padding-right: 30px; padding-bottom: 60px; color: #999; }
  .texto strong { font-weight: 600; }
  .texto p + p { margin-top: 22px; }
  .texto a { color: #666; }

  .abrir-menu { display: none; }
  .cintas { display: none; }

  /* Pantallas medianas: columna izquierda más angosta */
  @media (max-width: 1024px) {
    .lateral { width: 260px; }
    .logo { font-size: 32px; }
    .galeria, .texto, .tienda, .ficha, .pie-fijo, .blog, .entrada { left: 260px; }
    .ficha { flex-direction: column; }
    .ficha .imagenes { width: min(360px, 100%); }
  }

  /* Celular: cabecera con botón de menú y contenido a todo el ancho */
  @media (max-width: 760px) {
    .lateral { position: sticky; top: 0; width: auto; bottom: auto; padding: 0 16px; overflow: visible; border-bottom: 1px solid #f0f0f0; }
    .logo { display: inline-block; margin: 14px 0; height: auto; font-size: 28px; line-height: 36px; position: relative; z-index: 2; }

    /* Botón: dos líneas finas que se cruzan en una ✕ al abrir */
    .abrir-menu {
      display: block; position: absolute; top: 14px; right: 6px; z-index: 2;
      width: 44px; height: 36px; background: none; border: 0; cursor: pointer;
    }
    .abrir-menu span {
      position: absolute; left: 11px; width: 22px; height: 1px; background: #555;
      transition: transform .35s cubic-bezier(.2, .7, .2, 1), top .35s cubic-bezier(.2, .7, .2, 1);
    }
    .abrir-menu span:first-child { top: 14px; }
    .abrir-menu span:last-child { top: 21px; }
    .lateral.abierto .abrir-menu span:first-child { top: 18px; transform: rotate(45deg); }
    .lateral.abierto .abrir-menu span:last-child { top: 18px; transform: rotate(-45deg); }

    /* Menú a pantalla completa, letra grande y ligera; los ítems entran escalonados */
    .navegacion {
      position: fixed; inset: 0; z-index: 1; background: #fff; overflow-y: auto;
      padding: 80px 24px 24px; display: flex; flex-direction: column;
      opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility 0s linear .3s;
    }
    .lateral.abierto .navegacion { opacity: 1; visibility: visible; transition: opacity .3s ease; }
    /* Franja esmerilada bajo el nombre y el botón: lo que se desplaza por debajo se ve borroso */
    .lateral::before {
      content: ""; position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 2; pointer-events: none;
      background: rgba(255, 255, 255, .7);
      -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
      opacity: 0; transition: opacity .3s ease;
    }
    .lateral.abierto::before { opacity: 1; }
    .logo, .abrir-menu { z-index: 3; }
    .menu { margin: 0 0 24px; }
    .menu li { opacity: 0; transform: translateY(8px); transition: opacity .4s ease, transform .4s cubic-bezier(.2, .7, .2, 1); }
    .lateral.abierto .menu li { opacity: 1; transform: none; transition-delay: calc(var(--i) * 25ms + 60ms); }
    /* Tamaño según el alto visible real (con las barras del navegador), para que quepa sin desplazarse */
    .menu a { display: inline-block; font-size: clamp(16px, 2.7svh, 20px); line-height: clamp(24px, 4.1svh, 31px); }
    .menu li.espacio { height: clamp(6px, 1.4svh, 12px); }
    .menu a[aria-current="page"] { color: #aaa; }
    .derechos { margin-top: auto; }
    .idiomas { margin-top: 14px; font-size: 14px; }
    .idiomas button { margin-right: 14px; padding: 4px 0; }

    .galeria, .texto, .tienda, .ficha { position: static; padding: 24px 16px 40px; }
    .galeria { flex-direction: column; }
    /* Inicio: la foto centrada en el alto que queda bajo la cabecera (65 px) y la página sin desplazamiento */
    body.en-inicio { overflow: hidden; }

    /* Cintas "For sale / Blog / Studio" (las de christianjamett.com): se pegan una tras otra,
       cada una con su inclinación, y al tocarlas se aprietan y se enderezan */
    .galeria.inicio .cintas { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 26px; }
    /* Cinta de papel dibujada: translúcida, bordes rasgados, fibra, sombra suave y destacador amarillo */
    .cinta {
      display: block; -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .10)) drop-shadow(0 6px 10px rgba(0, 0, 0, .06));
      transform: translateX(var(--x)) rotate(var(--r));
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), filter .3s;
      /* "backwards" y no "both": al terminar manda el transform normal, así funciona el efecto al tocar */
      animation: pegar .6s cubic-bezier(.2, .9, .25, 1.25) backwards;
      animation-delay: calc(var(--n) * 130ms + 250ms);
    }
    .cinta:active {
      transform: translateX(var(--x)) translateY(-3px) rotate(0deg) scale(1.03); transition-duration: .12s;
      filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .12)) drop-shadow(0 12px 16px rgba(0, 0, 0, .10));
    }
    .papel {
      display: block; padding: 10px 38px 8px; min-width: 190px; text-align: center;
      background:
        repeating-linear-gradient(97deg, rgba(255, 255, 255, .10) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(3deg, rgba(120, 100, 60, .05) 0 1px, transparent 1px 6px),
        linear-gradient(180deg, rgba(255, 255, 255, .35), rgba(255, 255, 255, 0) 40%, rgba(0, 0, 0, .04)),
        rgba(226, 214, 186, .9);
      clip-path: polygon(0 0, 100% 0, 97.5% 11%, 100% 22%, 98% 34%, 100% 46%, 97% 58%, 99.5% 70%, 97.5% 82%, 100% 92%, 98.5% 100%,
        1.5% 100%, 0 91%, 2.5% 80%, .5% 68%, 3% 56%, 0 44%, 2% 32%, .5% 20%, 3% 9%);
    }
    .marca {
      font-family: "Gochi Hand", cursive; font-size: 32px; line-height: 38px; color: #151515; white-space: nowrap;
      padding: 0 6px;
      background: linear-gradient(176deg, transparent 52%, rgba(255, 230, 0, .9) 53%, rgba(255, 230, 0, .9) 80%, transparent 81%);
    }
    .cinta:nth-child(1) { --x: -8px; --r: -2.5deg; --n: 0; }
    .cinta:nth-child(2) { --x: 12px; --r: 1.8deg; --n: 1; }
    .cinta:nth-child(3) { --x: -4px; --r: -1.2deg; --n: 2; }
    @keyframes pegar {
      from { opacity: 0; transform: translate(var(--x), -14px) rotate(calc(var(--r) - 7deg)) scale(1.08); }
      to { opacity: 1; transform: translateX(var(--x)) rotate(var(--r)); }
    }
    @media (prefers-reduced-motion: reduce) {
      @keyframes pegar { from { opacity: 0; } to { opacity: 1; } }
    }
    .galeria.inicio {
      justify-content: center; padding: 0 16px 24px;
      height: calc(100vh - 65px); height: calc(100svh - 65px);
    }
    .galeria.inicio figure { display: block; }
    @media (prefers-reduced-motion: reduce) { .menu li { transform: none; } }
    .galeria img { width: 100%; height: auto; min-height: 0; }
    .galeria figcaption { display: block; }
    .lema { font-size: 15px; line-height: 22px; }
    .pie-fijo { display: none; }
    .grilla { grid-template-columns: repeat(2, 1fr); gap: 28px 14px; }
    .marco { padding: 8px; }
    .ficha { gap: 24px; }
    .ficha .imagenes, .ficha .datos { width: 100%; max-width: none; }
    .blog, .entrada { position: static; padding: 24px 16px 56px; }
    .entrada-item { grid-template-columns: 1fr; gap: 18px; padding-bottom: 36px; margin-bottom: 36px; }
    .entrada-item h2, .entrada-item.destacada h2 { font-size: 24px; }
    .entrada h1 { font-size: 30px; }
    .cuerpo .cita { font-size: 22px; line-height: 31px; }
    .vecinas { grid-template-columns: 1fr; }
    .vecinas a + a, .vecinas .derecha { text-align: left; }
  }
</style>
</head>
<body>

<aside class="lateral">
  <a class="logo" href="#/">Christian Jamett</a>
  <button class="abrir-menu" id="abrir-menu" type="button" aria-expanded="false" aria-controls="navegacion"><span></span><span></span></button>
  <div class="navegacion" id="navegacion">
    <ul class="menu" id="menu"></ul>
    <div class="derechos lucida" id="derechos"></div>
    <div class="idiomas lucida" id="idiomas"></div>
    <a class="ig" href="https://www.instagram.com/christianjamett/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="2" fill="currentColor"/><rect x="1.5" y="5.5" width="13" height="1" fill="#fff"/><circle cx="8" cy="9" r="3.4" fill="#fff"/><circle cx="8" cy="9" r="2.3" fill="currentColor"/><rect x="11" y="2" width="3" height="2.4" fill="#fff"/></svg>
    </a>
  </div>
</aside>

<div class="progreso" id="progreso" aria-hidden="true"></div>
<main id="contenido"></main>

<script>
  // Fotos guardadas dentro del sitio (copiadas desde el WordPress de christianjamett.com, misma ruta)
  const U = 'img/';
  const fotos = (base, nombres) => nombres.map(n => U + base + n);
  const IDIOMAS = ['es', 'it', 'fr', 'en'];
  const CORREO = 'info@christianjamett.com';

  let lang = 'es';
  try { if (IDIOMAS.includes(localStorage.getItem('idioma'))) lang = localStorage.getItem('idioma'); } catch (e) {}
  // Un texto puede ser igual en todos los idiomas (string) o traducido ({ es, it, fr, en })
  const t = v => (v && typeof v === 'object') ? (v[lang] ?? v.es) : v;

  const ui = {
    derechos: { es: 'all rights reserved © christian jamett', it: 'tutti i diritti riservati © christian jamett', fr: 'tous droits réservés © christian jamett', en: 'all rights reserved © christian jamett' },
    foto: { es: 'fotografía', it: 'fotografia', fr: 'photographie', en: 'photograph' },
    consultas: { es: 'Consultas y pedidos', it: 'Informazioni e ordini', fr: 'Renseignements et commandes', en: 'Inquiries and orders' },
    aPedido: { es: 'Consultar', it: 'Su richiesta', fr: 'Sur demande', en: 'On request' },
    cadaUna: { es: 'c/u', it: "l'una", fr: 'pièce', en: 'each' },
    expos: { es: 'Exposiciones:', it: 'Mostre:', fr: 'Expositions :', en: 'Exhibitions:' },
    contacto: { es: 'Contacto:', it: 'Contatti:', fr: 'Contact :', en: 'Contact:' },
    menu: { es: 'Menú', it: 'Menu', fr: 'Menu', en: 'Menu' },
    leer: { es: 'Leer', it: 'Leggi', fr: 'Lire', en: 'Read' },
    lectura: { es: 'min de lectura', it: 'min di lettura', fr: 'min de lecture', en: 'min read' },
    anterior: { es: 'Entrada anterior', it: 'Articolo precedente', fr: 'Article précédent', en: 'Previous post' },
    siguiente: { es: 'Entrada siguiente', it: 'Articolo successivo', fr: 'Article suivant', en: 'Next post' },
    atajos: { es: 'Accesos', it: 'Collegamenti', fr: 'Raccourcis', en: 'Shortcuts' },
    cintaVenta: { es: 'Venta', it: 'In vendita', fr: 'À vendre', en: 'For sale' },
    cintaEstudio: { es: 'Estudio', it: 'Studio', fr: 'Studio', en: 'Studio' },
    cerrar: { es: 'Cerrar', it: 'Chiudi', fr: 'Fermer', en: 'Close' },
    cuadro: { es: 'Cuadros', it: 'Quadri', fr: 'Tableaux', en: 'Framed works' },
    print: { es: 'Prints · edición limitada', it: 'Stampe · edizione limitata', fr: 'Tirages · édition limitée', en: 'Prints · limited edition' },
    libro: { es: 'Libros', it: 'Libri', fr: 'Livres', en: 'Books' },
    postal: { es: 'Postales', it: 'Cartoline', fr: 'Cartes postales', en: 'Postcards' },
  };

  /* ---------- Venta ---------- */
  const textoPrint = {
    es: 'Chiches fotográficos, edición limitada.<br>Papel 100 % algodón.<br>20 × 30 cm.<br>También en 60 × 90 cm, edición de 7 copias.<br>Firmada, con certificado de autenticidad.',
    it: 'Chiches fotográficos, edizione limitata.<br>Carta 100% cotone.<br>20 × 30 cm.<br>Disponibile anche in 60 × 90 cm, edizione di 7 copie.<br>Firmata, con certificato di autenticità.',
    fr: 'Chiches fotográficos, édition limitée.<br>Papier 100 % coton.<br>20 × 30 cm.<br>Aussi en 60 × 90 cm, édition de 7 exemplaires.<br>Signé, avec certificat d’authenticité.',
    en: 'Chiches fotográficos, limited edition.<br>100% cotton paper.<br>20 × 30 cm.<br>Also in 60 × 90 cm, edition of 7.<br>Signed, with certificate of authenticity.',
  };
  const textoPostal = {
    es: 'Edición analógica, proceso tradicional de laboratorio.<br>La textura, el grano y la autenticidad de la fotografía química.<br>10 × 15 cm.<br>Firmadas y embaladas con cuidado para su envío.',

  const bio = {
    es: `<p><strong>Sobre mí:</strong><br>Fotógrafo chileno y Doctor en Historia del Arte de la Universidad de Perpignan, Francia, con especialización en fotografía chilena y mexicana. Tiene como base Chile e Italia y parte su carrera hace más de 20 años con trabajos realizados desde la vereda de la fotografía autoral.</p>
      <p>El año 2002 inicia una seguidilla de registros de cuerpos pintados masivos en diferentes lugares de Chile, donde el acento era la performance que representaba la desgracia de la sociedad, para luego concentrar sus esfuerzos hasta hoy en la fotografía documental, apuntando a temas humanos, con hincapié en los grupos menos valorados por la sociedad.</p>
      <p>Actualmente es fotógrafo de la agencia <em>Getty Images</em>, donde el registro se concentra en la riqueza de Latinoamérica y Europa. También ha trabajado para medios nacionales y ha sido colaborador de agencias internacionales como <em>France Presse</em> y <em>Majority World</em>; sus imágenes han sido parte de medios como <em>Chicago Tribune</em>, <em>CBS News</em> y <em>CBS San Francisco</em>, entre otros. Su trabajo ha sido expuesto en Francia, Corea del Sur, México, Brasil, Uruguay y Chile.</p>
      <p>Desde 2014 crea y dirige el festival internacional de fotografía <a href="https://www.fotoarica.com/" target="_blank" rel="noopener">Foto Arica</a>. Ha publicado dos libros: <em>ABU</em> (2017), bajo el sello Ediciones La Visita, y <em>Diáspora</em> (2019), sobre las mujeres afrodescendientes y su puesta en valor, con el sello Foto Arica.</p>`,
    it: `<p><strong>Chi sono:</strong><br>Fotografo cileno e Dottore in Storia dell’Arte all’Università di Perpignan, Francia, specializzato in fotografia cilena e messicana. Vive tra il Cile e l’Italia e ha iniziato la sua carriera più di 20 anni fa, partendo dalla fotografia d’autore.</p>
      <p>Nel 2002 avvia una serie di registrazioni di corpi dipinti di massa in diversi luoghi del Cile, dove l’accento era posto sulla performance che rappresentava la disgrazia della società. In seguito concentra il suo lavoro, fino a oggi, sulla fotografia documentaria: temi umani, con particolare attenzione ai gruppi meno valorizzati dalla società.</p>
      <p>Attualmente è fotografo dell’agenzia <em>Getty Images</em>, dove documenta la ricchezza dell’America Latina e dell’Europa. Ha lavorato per media nazionali e collaborato con agenzie internazionali come <em>France Presse</em> e <em>Majority World</em>; le sue immagini sono apparse su testate come <em>Chicago Tribune</em>, <em>CBS News</em> e <em>CBS San Francisco</em>, tra le altre. Il suo lavoro è stato esposto in Francia, Corea del Sud, Messico, Brasile, Uruguay e Cile.</p>
      <p>Dal 2014 ha creato e dirige il festival internazionale di fotografia <a href="https://www.fotoarica.com/" target="_blank" rel="noopener">Foto Arica</a>. Ha pubblicato due libri: <em>ABU</em> (2017), per Ediciones La Visita, e <em>Diáspora</em> (2019), dedicato alle donne afrodiscendenti e alla loro valorizzazione, per Foto Arica.</p>`,
    fr: `<p><strong>À propos :</strong><br>Photographe chilien et docteur en histoire de l’art de l’Université de Perpignan, spécialisé dans la photographie chilienne et mexicaine. Basé entre le Chili et l’Italie, il a commencé sa carrière il y a plus de 20 ans, du côté de la photographie d’auteur.</p>
      <p>En 2002, il entreprend une série de prises de vue de corps peints en masse dans différents lieux du Chili, où l’accent était mis sur la performance représentant le malheur de la société. Il se consacre ensuite, jusqu’à aujourd’hui, à la photographie documentaire : des sujets humains, en particulier les groupes les moins valorisés par la société.</p>
      <p>Il est actuellement photographe pour l’agence <em>Getty Images</em>, où il couvre la richesse de l’Amérique latine et de l’Europe. Il a travaillé pour des médias nationaux et collaboré avec des agences internationales comme <em>France Presse</em> et <em>Majority World</em> ; ses images ont été publiées notamment par le <em>Chicago Tribune</em>, <em>CBS News</em> et <em>CBS San Francisco</em>. Son travail a été exposé en France, en Corée du Sud, au Mexique, au Brésil, en Uruguay et au Chili.</p>
      <p>Depuis 2014, il a créé et dirige le festival international de photographie <a href="https://www.fotoarica.com/" target="_blank" rel="noopener">Foto Arica</a>. Il a publié deux livres : <em>ABU</em> (2017), aux Ediciones La Visita, et <em>Diáspora</em> (2019), consacré aux femmes afrodescendantes et à leur mise en valeur, aux éditions Foto Arica.</p>`,
    en: `<p><strong>About me:</strong><br>Chilean photographer and Doctor in Art History from the University of Perpignan, France, specializing in Chilean and Mexican photography. Based between Chile and Italy, he began his career more than 20 years ago, working from the standpoint of authorial photography.</p>
      <p>In 2002 he began a series of recordings of mass painted bodies in different parts of Chile, where the focus was a performance representing society’s misfortune. He then turned to documentary photography, which remains his focus today: human themes, with an emphasis on the groups society values least.</p>
      <p>He is currently a photographer for <em>Getty Images</em>, covering the richness of Latin America and Europe. He has worked for national news media and contributed to international agencies such as <em>France Presse</em> and <em>Majority World</em>; his images have appeared in the <em>Chicago Tribune</em>, <em>CBS News</em> and <em>CBS San Francisco</em>, among others. His work has been exhibited in France, South Korea, Mexico, Brazil, Uruguay and Chile.</p>
      <p>Since 2014 he has created and directed the international photography festival <a href="https://www.fotoarica.com/" target="_blank" rel="noopener">Foto Arica</a>. He has published two books: <em>ABU</em> (2017), with Ediciones La Visita, and <em>Diáspora</em> (2019), on Afro-descendant women and their recognition, with Foto Arica.</p>`,

        ['p', 'En el extremo norte de Chile, donde el desierto dialoga con el mar y la cordillera observa desde lejos, el Carnaval Andino con la Fuerza del Sol vuelve a transformar la ciudad en un cuerpo colectivo. No es solo una festividad: es memoria en movimiento, identidad en despliegue, y un acto de resistencia cultural que mantiene vivo el pulso del mundo andino.'],
        ['p', 'Este año, mi registro fotográfico se suma a esa energía desde una mirada que continúa el proceso iniciado en el proyecto Anata: entre lo sagrado y lo pagano. Si Anata explora la dimensión simbólica, ritual y profundamente humana del mundo andino, el carnaval se convierte en su expansión natural: la calle como escenario, la música como respiración, el traje como archivo textil.'],

      <nav class="vecinas">
        ${vieja ? `<a href="#/blog/${vieja.id}"><span class="meta lucida">← ${t(ui.anterior)}</span><strong>${t(vieja.titulo)}</strong></a>` : '<span></span>'}
        ${nueva ? `<a class="derecha" href="#/blog/${nueva.id}"><span class="meta lucida">${t(ui.siguiente)} →</span><strong>${t(nueva.titulo)}</strong></a>` : ''}
      </nav>
    </article>`;
  }

  // Apariciones al bajar: cada bloque con data-aparece entra cuando asoma en pantalla
  const observador = 'IntersectionObserver' in window ? new IntersectionObserver(lista => lista.forEach(x => {
    if (x.isIntersecting) { x.target.classList.add('visible'); observador.unobserve(x.target); }
  }), { rootMargin: '0px 0px -8% 0px' }) : null;
  const observarApariciones = () => contenido.querySelectorAll('[data-aparece]').forEach(el =>
    observador ? observador.observe(el) : el.classList.add('visible'));

  function vistaTienda() {
    return `<div class="tienda"><div class="grilla">${productos.map((p, i) => `<a href="#/venta/${p.id}">
      <span class="tipo lucida">${i === 0 || productos[i - 1].tipo !== p.tipo ? t(ui[p.tipo]) : ''}</span>
      <span class="marco">${img(p.fotos[0], p.titulo, i)}</span>
      <div class="pie lucida"><strong>${p.titulo}</strong><br>${t(p.corto)}<br><span class="precio">${precioCompleto(p)}</span></div>
    </a>`).join('')}</div></div>`;
  }

  // Si un grupo no cabe en lo que queda de la fila, empieza en la siguiente (así no se parte)
  function noPartirGrupos() {
    const grilla = contenido.querySelector('.grilla');
    if (!grilla) return;
    const fichas = [...grilla.children];
    fichas.forEach(a => { a.style.gridColumnStart = ''; });
    const cols = getComputedStyle(grilla).gridTemplateColumns.split(' ').length;
    let pos = 0;
    for (let i = 0; i < productos.length;) {
      let n = 1;
      while (productos[i + n] && productos[i + n].tipo === productos[i].tipo) n++;
      if (pos > 0 && pos + n > cols && n <= cols) { fichas[i].style.gridColumnStart = 1; pos = 0; }
      pos = (pos + n) % cols;
      i += n;
    }
  }
  addEventListener('resize', () => requestAnimationFrame(noPartirGrupos));

  function vistaProducto(p) {
    const asunto = encodeURIComponent(p.titulo);
    return `<div class="ficha">
      <div class="imagenes">${p.fotos.map((src, i) => img(src, `${p.titulo}, ${t(ui.foto)} ${i + 1}`, i)).join('')}</div>
      <div class="datos lucida">
        <p><strong>${p.titulo}</strong><br><span class="precio">${precioCompleto(p)}</span></p>
        <p>${t(p.corto)}</p>
        ${p.intro ? `<p>${t(p.intro)}</p>` : ''}
        <p>${t(p.largo)}</p>
        <p>${t(ui.consultas)}: <a href="mailto:${CORREO}?subject=${asunto}">${CORREO}</a></p>
      </div>
    </div>`;
  }

  function mostrar() {
    const [id, sub] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
    const actual = paginas[id] ? id : '';
    const p = paginas[actual];
    const producto = actual === 'venta' && productos.find(x => x.id === sub);
    const entrada = actual === 'blog' && entradas.find(x => x.id === sub);

    document.documentElement.lang = lang;
    document.body.classList.toggle('en-inicio', !actual);
    document.title = (producto || entrada) ? `${t((producto || entrada).titulo)} — Christian Jamett` : actual ? `${t(p.titulo)} — Christian Jamett` : 'Christian Jamett';
    menu.innerHTML = orden.map((k, i) => k === null
      ? '<li class="espacio" aria-hidden="true"></li>'
      : `<li style="--i:${i}"><a href="#/${k}"${k === actual ? ' aria-current="page"' : ''}>${t(paginas[k].titulo)}</a></li>`).join('');
    document.getElementById('derechos').textContent = t(ui.derechos);
    abrirMenu.setAttribute('aria-label', t(lateral.classList.contains('abierto') ? ui.cerrar : ui.menu));
    document.getElementById('idiomas').innerHTML = IDIOMAS.map(l =>
      `<button type="button" lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('');

    contenido.innerHTML = producto ? vistaProducto(producto)
      : entrada ? vistaEntrada(entrada)
      : p.blog ? vistaBlog()
      : p.tienda ? vistaTienda()
      : p.texto ? `<div class="texto">${p.texto()}</div>`
      : `<div class="galeria${actual ? '' : ' inicio'}">${p.fotos.map((src, i) => `<figure>${img(src, `${t(p.titulo)}, ${t(ui.foto)} ${i + 1}`, i)}${
          textoPie(src) ? `<figcaption class="lucida">${textoPie(src)}</figcaption>` : ''}${
          actual ? '' : '<p class="lema" lang="la">Memento mori, et in luce renasceris</p>'}</figure>`).join('')}${actual ? '' : cintas()}</div>
          <div class="pie-fijo lucida" aria-hidden="true"></div>`;
    noPartirGrupos();
    actualizarPie();
    observarApariciones();
    actualizarProgreso();
  }

  // Menú del celular (pantalla completa; mientras está abierto la página de fondo no se desplaza)
  function cerrarMenu() {
    lateral.classList.remove('abierto');
    abrirMenu.setAttribute('aria-expanded', 'false');
    abrirMenu.setAttribute('aria-label', t(ui.menu));
    document.body.style.overflow = '';
  }
  abrirMenu.addEventListener('click', () => {
    const abierto = lateral.classList.toggle('abierto');
    abrirMenu.setAttribute('aria-expanded', String(abierto));
    abrirMenu.setAttribute('aria-label', t(abierto ? ui.cerrar : ui.menu));
    document.body.style.overflow = abierto ? 'hidden' : '';
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && lateral.classList.contains('abierto')) { cerrarMenu(); abrirMenu.focus(); } });

  addEventListener('hashchange', () => { animando = false; destino = 0; cerrarMenu(); mostrar(); scrollTo(0, 0); });
  document.getElementById('idiomas').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    lang = b.lang;
    try { localStorage.setItem('idioma', lang); } catch (err) {}
    mostrar();
  });
  mostrar();

  // Carrusel suave: la rueda fija un destino y la tira se acerca a él frenando de a poco.
  // Va siempre activo (también con "reducir movimiento"), porque el usuario lo pidió.
  let destino = 0, animando = false, antes = 0;
  const maxX = () => document.documentElement.scrollWidth - innerWidth;
  function avanzar(ahora) {
    const falta = destino - scrollX;
    if (!animando) return;
    if (Math.abs(falta) < 1) { scrollTo(destino, 0); animando = false; return; }
    // Fracción por tiempo transcurrido, para que se sienta igual en monitores de 60 o 144 Hz
    const k = 1 - Math.pow(0.92, Math.min(ahora - antes, 50) / 16.7);
    antes = ahora;
    // mínimo 1 px por cuadro: el navegador puede redondear el desplazamiento y dejarlo pegado
    scrollTo(scrollX + (Math.abs(falta * k) < 1 ? Math.sign(falta) : falta * k), 0);
    requestAnimationFrame(avanzar);
  }
  addEventListener('wheel', e => {
    if (!contenido.querySelector('.galeria') || innerWidth <= 760 || e.target.closest('.lateral')) return;
    e.preventDefault();
    if (!animando) destino = scrollX;
    destino = Math.max(0, Math.min(maxX(), destino + e.deltaY + e.deltaX));
    if (!animando) { animando = true; antes = performance.now(); requestAnimationFrame(avanzar); }
  }, { passive: false });

  // El pie fijo muestra el lugar y año de la foto que se está viendo (la primera que asoma tras el menú)
  function actualizarPie() {
    const pie = contenido.querySelector('.pie-fijo');
    if (!pie) return;
    const borde = document.querySelector('.lateral').offsetWidth + 120;
    const figura = [...contenido.querySelectorAll('.galeria figure')].find(f => f.getBoundingClientRect().right > borde);
    const texto = figura ? textoPie(figura.querySelector('img').getAttribute('src')) : '';
    if (pie.textContent !== texto) pie.textContent = texto;
  }
  // Barra fina arriba que avanza según cuánto se ha leído de la entrada
  function actualizarProgreso() {
    const total = document.documentElement.scrollHeight - innerHeight;
    document.getElementById('progreso').style.transform = `scaleX(${contenido.querySelector('.entrada') && total > 0 ? Math.min(1, scrollY / total) : 0})`;
  }
  addEventListener('scroll', () => {
    if (!animando) destino = scrollX; // barra de desplazamiento o teclado
    actualizarPie();
    actualizarProgreso();
  }, { passive: true });
  contenido.addEventListener('load', actualizarPie, true); // los anchos reales llegan cuando carga cada foto
</script>
</body>
</html>
